name: Publish GitHub Pages

# Pages must be enabled once in the repo settings (Source: GitHub Actions)
  # before this workflow can create a deployment. It is manual so a missing
  # setting does not fail every push. Branch publishing from main / (root)
  # also serves this site and does not need this workflow.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -a index.html styles.css app.js .nojekyll README.md LICENSE docs _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
